name: "Build dist package"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v6"

      - name: "Setup node"
        uses: "actions/setup-node@v6"
        with:
          node-version: ">=22"

      - name: "Install dependencies & build"
        run: "npm ci"

      - name: "Upload dist"
        uses: "actions/upload-artifact@v7"
        with:
          name: dist-folder
          path: dist/
          overwrite: true
